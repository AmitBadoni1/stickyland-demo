name: Build and deploy StickyLand

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stickyland-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-browser.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: yarn

      - name: Install the pinned build environment
        run: python -m pip install --requirement requirements-build.txt

      - name: Download pinned browser-side Python wheels
        run: >-
          python -m pip download --no-deps --only-binary=:all:
          --dest pypi --requirement requirements-browser.txt

      - name: Install JavaScript dependencies
        run: jlpm install --frozen-lockfile

      - name: Build and package StickyLand
        run: |
          jlpm run eslint:check
          jlpm run build:prod
          python -m build --wheel --no-isolation
          python -m pip install --force-reinstall --no-deps dist/jupyterlab_stickyland-*.whl

      - name: Build the JupyterLite site
        run: jupyter lite build --config jupyter_lite_config.json

      - name: Validate the generated site
        run: python scripts/validate_site.py

      - name: Upload the generated site
        uses: actions/upload-artifact@v4
        with:
          name: stickyland-site
          path: _output
          if-no-files-found: error

      - name: Deploy to the configured gh-pages branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_output
          publish_branch: gh-pages
          force_orphan: true
